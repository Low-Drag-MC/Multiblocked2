repositories {
    mavenLocal()
    // keep these two first. ForgeGradle downloads forge/mcp/its tools and the whole vanilla library
    // set by walking the repositories in order and taking the first hit, without validating what it
    // gets back. a mirror further down that answers 200 with an html page would be cached as e.g.
    // forge-userdev.jar or patchy.jar and break the build until the cache is wiped by hand, so the
    // authoritative sources have to be reached first.
    maven { url = "https://maven.minecraftforge.net/" } // Forge, MCP, ForgeGradle tools
    maven { url = "https://libraries.minecraft.net/" } // vanilla minecraft libraries
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU, Jade
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu, EMI
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
    maven { url "https://maven.architectury.dev/" } // architectury
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    } // Curse Forge File
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    } // JEI
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
    maven { // LDLib Configuration
        name "firstdarkdev"
        url "https://maven.firstdark.dev/snapshots"
    }
    // https://tehnut.info/maven/ (blood magic) is gone: it 301s every path to an unrelated site which
    // answers 200 with an html page, so ForgeGradle happily caches that html as maven-metadata.xml and
    // then fails to resolve its own tools. The blood magic dependency is commented out anyway.
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { // Flywheel
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.jozufozu.flywheel")
            includeGroup("com.tterrag.registrate")
            includeGroup("com.simibubi.create")
        }
    }
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { // TOP
        url "https://maven.k-4u.nl"
    }
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url 'https://jitpack.io' } // Mixin Extras, Fabric ASM
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    // keep this last. ModMaven answers 200 with an html redirect page instead of 404 for everything
    // it doesn't host, and ForgeGradle keeps whatever bytes come back without looking at them, so
    // being asked first would make it cache that page as forge-userdev.jar / patchy.jar / a mod's
    // sources jar and kill the build until the cache is wiped by hand. asking it last means every
    // artifact that exists anywhere else is already resolved before it gets a chance. the group list
    // narrows it further -- it is the only source we have for AE2, Mekanism and PneumaticCraft.
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "appeng"
            includeGroup "com.tterrag.registrate"
            includeGroup "me.desht.pneumaticcraft"
            includeGroup "mekanism"
            includeGroup "mezz.jei"
            includeGroup "top.theillusivec4.curios"
            includeGroup "vazkii.botania"
            includeGroup "vazkii.patchouli"
        }
    } // AE2, Mekanism, PneumaticCraft, Botania, Curios, JEI mirror
}
