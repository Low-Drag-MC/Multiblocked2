repositories {
    mavenLocal()
    // keep this first: ForgeGradle's own downloader walks the repositories in order and takes the
    // first hit, so the forge/mcp artifacts must be found here before any third party mirror.
    maven { url = "https://maven.minecraftforge.net/" } // Forge, MCP
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU, Jade
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu, EMI
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
    maven { url "https://maven.architectury.dev/" } // architectury
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    } // Curse Forge File
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    } // JEI
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            // it answers 200 with an html redirect page instead of 404 for anything it doesn't host,
            // which ForgeGradle happily caches as e.g. forge-userdev.jar and then fails to unzip it
            // ("Invalid patcher dependency" / "zip END header not found"). keep it away from the
            // artifacts ForgeGradle downloads by itself, it hosts no minecraft/forge/mcp anyway.
            excludeGroup "net.minecraftforge"
            excludeGroup "de.oceanlabs.mcp"
            excludeGroup "net.minecraft"
        }
    } // JEI mirror, AE2, Mekanism, PneumaticCraft
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
    maven { // LDLib Configuration
        name "firstdarkdev"
        url "https://maven.firstdark.dev/snapshots"
    }
    // https://tehnut.info/maven/ (blood magic) is gone: it 301s every path to an unrelated site which
    // answers 200 with an html page, so ForgeGradle happily caches that html as maven-metadata.xml and
    // then fails to resolve its own tools. The blood magic dependency is commented out anyway.
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { // Flywheel
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.jozufozu.flywheel")
            includeGroup("com.tterrag.registrate")
            includeGroup("com.simibubi.create")
        }
    }
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { // TOP
        url "https://maven.k-4u.nl"
    }
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url 'https://jitpack.io' } // Mixin Extras, Fabric ASM
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
}