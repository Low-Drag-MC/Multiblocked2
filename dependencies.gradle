dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // LDLib2
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")

//    // KilaGraph
    jarJar(implementation(group: 'com.lowdragmc.kilagraph', name: "kilagraph-neoforge-${minecraft_version}")) {
        version {
            // Version used in your workspace and bundled in mod jar
            prefer "${kilagraph_version}"
        }
    }

    // JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}") { transitive = false }
    localImplementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // REI
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")

    // EMI
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    compileOnly("dev.emi:emi-neoforge:${emi_version}")

    // Geckolib
    localImplementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    localImplementation("com.eliotlash.mclib:mclib:20")

    // Photon
    //
    // -PnoPhoton takes it off the *runtime* classpath while leaving it on the compile one, so a dev
    // run can answer the only question the guarded integration raises: does everything still load
    // when the jar is not there? MBD2 declares photon optional in neoforge.mods.toml and keeps every
    // Photon type behind a nested class reached only past an isPhotonLoaded() check, and that is a
    // claim about class resolution — reasoning about it proves nothing, running without the jar does.
    //
    //   gradlew runGameTestServer -PnoPhoton
    //   gradlew runClient -PldTest=mbd2_no_photon -PnoPhoton
    def photon = "com.lowdragmc.photon:photon-neoforge-${minecraft_version}:${photon2_version}"
    if (project.hasProperty('noPhoton')) {
        compileOnly(photon) { transitive = false }
    } else {
        localImplementation(photon) { transitive = false }
    }

    // Botania
//    compileOnly("vazkii.botania:botania-neoforge-${minecraft_version}:${botania_version}:api")
//    localImplementation("vazkii.botania:botania-neoforge-${minecraft_version}:${botania_version}")
    localRuntimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    localRuntimeOnly("vazkii.patchouli:Patchouli:${patchouli_version}")

    // Mekanism
    //
    // -PnoMekanism, same idea as -PnoPhoton above and for the same reason. Mekanism is the soft
    // dependency whose absence is most likely to break something: MekanismRecipeContentNodes and
    // MekanismBlueprintNodes mention Mekanism API types in their very signatures, so registering one
    // without the jar is a NoClassDefFoundError. They rely on modID = "mekanism" being read from the
    // ASM scan data before the class is loaded, and that is a claim about class resolution — only a
    // run without the jar tests it.
    //
    //   gradlew runGameTestServer -PnoMekanism
    compileOnly("mekanism:Mekanism:${mekanism_version}:api")
    if (project.hasProperty('noMekanism')) {
        compileOnly("mekanism:Mekanism:${mekanism_version}")
    } else {
        localImplementation("mekanism:Mekanism:${mekanism_version}") // Mekanism
        localRuntimeOnly("mekanism:Mekanism:${mekanism_version}:additions")// Mekanism: Additions
        localRuntimeOnly("mekanism:Mekanism:${mekanism_version}:generators")// Mekanism: Generators
        localRuntimeOnly("mekanism:Mekanism:${mekanism_version}:tools")// Mekanism: Tools
    }

    // GTM
//    compileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}") { transitive = false }
//    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create
    localImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    localImplementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    localRuntimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    localImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // KubeJS
    localImplementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")  {
        exclude(group: "dev.architectury")
    }

    // Nature's Aura
    localImplementation("maven.modrinth:natures-aura:${natures_aura_version}")

    // Pneumaticcraft
    localImplementation("me.desht.pneumaticcraft:pneumaticcraft-repressurized:${pneumaticcraft_version}")

    // Blood Magic
//    implementation("com.wayoftime.bloodmagic:BloodMagic:${blood_magic_version}")

    // Embers Rekindled
    // TODO 1.21 not available
//    implementation("maven.modrinth:embers:${embers_rekindled_version}")

    // Mana and Artifice
//    implementation("maven.modrinth:mana-and-artifice:${mana_and_artifice_version}")

    // Jade
    localImplementation("maven.modrinth:jade:${jade_version}")

    // Ars Nouveau
//    localImplementation("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}")

    // AE2
    localImplementation("org.appliedenergistics:appliedenergistics2:${ae2_version}")
}